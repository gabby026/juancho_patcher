name: Build Juancho unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          xcodebuild             -project iOS/Juancho/Juancho.xcodeproj             -scheme Juancho             -sdk iphoneos             -configuration Release             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          rm -rf Payload Juancho-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Juancho.app Payload/
          /usr/bin/zip -qry Juancho-unsigned.ipa Payload

      - name: Validate IPA
        run: |
          test -f Juancho-unsigned.ipa
          unzip -l Juancho-unsigned.ipa | grep -q "Payload/Juancho.app/Info.plist"
          unzip -l Juancho-unsigned.ipa | grep -q "Payload/Juancho.app/PlugIns/JuanchoShare.appex/Info.plist"
          unzip -l Juancho-unsigned.ipa | grep -q "Payload/Juancho.app/PlugIns/JuanchoShare.appex/JuanchoShare"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Juancho-unsigned-ipa
          path: Juancho-unsigned.ipa
          if-no-files-found: error
