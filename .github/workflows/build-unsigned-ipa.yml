name: Build Juancho unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project iOS/Juancho/Juancho.xcodeproj -scheme Juancho -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Juancho.app Payload/
          zip -qry Juancho-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Juancho-unsigned-ipa
          path: Juancho-unsigned.ipa
