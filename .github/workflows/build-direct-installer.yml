name: Build Direct Juancho Installer IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project iOS/DirectInstaller/DirectInstaller.xcodeproj -list

      - name: Build unsigned app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild             -project iOS/DirectInstaller/DirectInstaller.xcodeproj             -scheme DirectInstaller             -configuration Release             -sdk iphoneos             CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             clean build

          test -d "$RUNNER_TEMP/build/DirectInstaller.app"
          test -f "$RUNNER_TEMP/build/DirectInstaller.app/DirectInstaller"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$RUNNER_TEMP/build/DirectInstaller.app/Info.plist"

      - name: Validate Juancho package reader
        run: |
          set -euo pipefail
          for file in             iOS/DirectInstaller/Models.swift             iOS/DirectInstaller/Crypto.swift             iOS/DirectInstaller/CompressionHelper.swift             iOS/DirectInstaller/JuanchoPackage.swift             iOS/DirectInstaller/FilesystemTarget.swift             iOS/DirectInstaller/PatchStore.swift             iOS/DirectInstaller/UploadViewModel.swift             iOS/DirectInstaller/ContentView.swift; do
            test -f "$file"
          done
          grep -q "JuanchoPackageCodec.decode" iOS/DirectInstaller/UploadViewModel.swift
          grep -q "passwordPrompt" iOS/DirectInstaller/UploadViewModel.swift
          grep -q "PatchStore" iOS/DirectInstaller/UploadViewModel.swift
          if grep -q "WebDAV" iOS/DirectInstaller/ContentView.swift; then
            echo "WebDAV UI reference found"
            exit 1
          fi

      - name: Add filesystem entitlements
        run: |
          set -euo pipefail
          ENTITLEMENTS="$RUNNER_TEMP/FilzaEntitlements.plist"
          /usr/bin/plutil -create xml1 "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Add :com.apple.private.security.no-sandbox bool true" "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Add :platform-application bool true" "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Add :com.apple.private.security.storage.AppDataContainers bool true" "$ENTITLEMENTS"
          /usr/bin/codesign --force --sign - --entitlements "$ENTITLEMENTS" "$RUNNER_TEMP/build/DirectInstaller.app"
          /usr/bin/codesign --verify --deep --strict "$RUNNER_TEMP/build/DirectInstaller.app"

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$RUNNER_TEMP/build/DirectInstaller.app" ipa/Payload/
          cd ipa
          /usr/bin/zip -qry Juancho-Installer-Filza.ipa Payload
          test -f Juancho-Installer-Filza.ipa
          unzip -l Juancho-Installer-Filza.ipa | grep -E 'Payload/DirectInstaller.app/(Info.plist|DirectInstaller)$'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Juancho-Installer-Filza-IPA
          path: ipa/Juancho-Installer-Filza.ipa
          if-no-files-found: error

      - name: Publish verified IPA bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          base64 < ipa/Juancho-Installer-Filza.ipa | tr -d '\n' > ci-output/Juancho-Installer-Filza.ipa.b64
          sha256sum ipa/Juancho-Installer-Filza.ipa > ci-output/Juancho-Installer-Filza.ipa.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output/Juancho-Installer-Filza.ipa.b64 ci-output/Juancho-Installer-Filza.ipa.sha256
          git commit -m "ci: publish verified Juancho Installer IPA [skip ci]" || true
          git push origin HEAD:main
